<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="clock"></canvas>
<script>
  // The widget's text and accent colors come from CHROVIQ as CSS variables (--chroviq-text, --chroviq-accent).
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function draw() {
    const scale = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * scale; canvas.height = h * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const text = css('--chroviq-text') || '#ffffff', accent = css('--chroviq-accent') || '#0078d4';
    const r = Math.min(w, h) / 2 - 10, cx = w / 2, cy = h / 2;
    ctx.clearRect(0, 0, w, h);

    // Hour marks
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      ctx.strokeStyle = text; ctx.globalAlpha = i % 3 === 0 ? 0.9 : 0.4;
      ctx.lineWidth = i % 3 === 0 ? 3 : 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx + Math.sin(a) * r * 0.86, cy - Math.cos(a) * r * 0.86);
      ctx.lineTo(cx + Math.sin(a) * r, cy - Math.cos(a) * r);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const now = new Date();
    const s = now.getSeconds() + now.getMilliseconds() / 1000, m = now.getMinutes() + s / 60, hr = (now.getHours() % 12) + m / 60;
    const hand = (turn, length, width, color) => {
      const a = turn * Math.PI * 2;
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.sin(a) * r * length, cy - Math.cos(a) * r * length);
      ctx.stroke();
    };
    hand(hr / 12, 0.5, 5, text);
    hand(m / 60, 0.75, 3.5, text);
    hand(s / 60, 0.85, 1.5, accent);
    ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
