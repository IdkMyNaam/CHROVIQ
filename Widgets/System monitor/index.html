<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: space-around; padding: 0 8px; box-sizing: border-box;
    color: var(--chroviq-text, #fff); font-family: var(--chroviq-font, "Segoe UI", sans-serif); user-select: none;
  }
  .gauge { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  svg { width: 78px; height: 78px; transform: rotate(-90deg); }
  .track { stroke: currentColor; opacity: 0.15; }
  .bar { stroke: var(--chroviq-accent, #0078d4); transition: stroke-dashoffset 0.6s ease; }
  .value { position: absolute; font-size: 17px; font-weight: 600; }
  .ring { position: relative; display: flex; align-items: center; justify-content: center; }
  .label { font-size: 12px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="gauge" id="cpu"></div>
  <div class="gauge" id="memory"></div>
  <div class="gauge" id="gpu"></div>
<script>
  const length = 2 * Math.PI * 32;
  function gauge(id, label) {
    const el = document.getElementById(id);
    el.innerHTML = `<div class="ring"><svg viewBox="0 0 78 78">
        <circle class="track" cx="39" cy="39" r="32" fill="none" stroke-width="7"/>
        <circle class="bar" cx="39" cy="39" r="32" fill="none" stroke-width="7" stroke-linecap="round"
                stroke-dasharray="${length}" stroke-dashoffset="${length}"/></svg>
      <span class="value">–</span></div><span class="label">${label}</span>`;
    return percent => {
      el.querySelector('.value').textContent = percent == null ? 'n/a' : percent + '%';
      el.querySelector('.bar').style.strokeDashoffset = length * (1 - Math.max(0, Math.min(100, percent ?? 0)) / 100);
    };
  }
  const cpu = gauge('cpu', 'CPU'), memory = gauge('memory', 'Memory'), gpu = gauge('gpu', 'GPU');

  // CHROVIQ sends { type: "stats", cpu, memory, memoryUsedGb, memoryTotalGb, gpu } every second.
  chroviq.on('stats', s => { cpu(s.cpu); memory(s.memory); gpu(s.gpu); });
</script>
</body>
</html>
