# CHROVIQ report relay. Deploy with: npx wrangler deploy (see README.md).
# The Discord webhook is NOT in this file: it's a secret, set with: npx wrangler secret put DISCORD_WEBHOOK
name = "chroviq-reports"
main = "worker.js"
compatibility_date = "2025-01-01"
# Only at https://reports.chroviq.com (Cloudflare makes the DNS record and certificate itself);
# not at the account's workers.dev address, and no extra preview addresses for each version.
routes = [{ pattern = "reports.chroviq.com", custom_domain = true }]
workers_dev = false
preview_urls = false

# 2 reports a minute per sender (by IP address).
[[ratelimits]]
name = "PER_SENDER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 2
  period = 60

# 20 reports a minute for everyone together.
[[ratelimits]]
name = "EVERYONE"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60
